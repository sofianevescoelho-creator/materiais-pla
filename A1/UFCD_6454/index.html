<style>
  :root {
    font-size: 16px;
    --bg: #fafbf9;

  body {

  details.mais > summary {

  details.mais[open] > summary .chev { transform: rotate(90deg); }

    gap: 0.8rem;

  .mais-aba { font-size: 0.92rem; line-height: 1.35; color: #5e6a44; }

  /* ===== Blocos fechados: o aluno vê só os títulos e abre o que procura ===== */

    gap: 0.8rem;

    box-sizing: border-box;
    padding: 0.6rem 1.1rem;
    background: #fff;
    border: 2px solid var(--accent);
    border-radius: 8px;
    cursor: pointer;
    list-style: none;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  details.bloco > summary::-webkit-details-marker { display: none; }
  details.bloco > summary:hover { background: var(--card); box-shadow: 0 2px 6px rgba(87, 111, 32, 0.15); }
  details.bloco > summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  details.bloco > summary .chev { font-size: 1.7rem; transition: transform 0.15s ease; }
  details.bloco[open] > summary .chev { transform: rotate(90deg); }
  details.bloco > summary h2.secao-titulo {
    flex: 1 1 auto;
    margin: 0;
    padding: 0;
    border: 0;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent);
  }
  details.bloco > ul { margin-top: 0.6rem; }

<script>
(function () {
  var campo = document.getElementById('busca');
  var secoes = Array.prototype.slice.call(document.querySelectorAll('#secoes .secao'));
  var blocos = secoes.map(function (s) { return s.querySelector('details.bloco'); });
  var aviso = document.getElementById('semResultados');
  var CHAVE = 'ufcd6454-blocos-abertos';
  var antes = null; /* blocos abertos antes de começar a pesquisa */

  function normalizar(txt) {
    return txt.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function abertos() {
    return blocos.map(function (d) { return d.open ? '1' : '0'; }).join('');
  }
  function repor(estado) {
    blocos.forEach(function (d, i) { d.open = estado.charAt(i) === '1'; });
  }
  function guardar() {
    if (campo.value.trim() !== '') return;
    try { sessionStorage.setItem(CHAVE, abertos()); } catch (e) {}
  }

  function filtrar() {
    var consulta = normalizar(campo.value.trim());
    var total = 0;
    if (consulta !== '' && antes === null) antes = abertos();
    secoes.forEach(function (secao, i) {
      var visiveis = 0;
      Array.prototype.slice.call(secao.querySelectorAll('li')).forEach(function (li) {
        var texto = normalizar(li.querySelector('.label').textContent + ' ' + (li.getAttribute('data-alt') || ''));
        var corresponde = consulta === '' || texto.indexOf(consulta) !== -1;
        li.classList.toggle('escondido', !corresponde);
        if (corresponde) visiveis++;
      });
      secao.classList.toggle('escondida', visiveis === 0);
      if (consulta !== '' && visiveis > 0) blocos[i].open = true;
      total += visiveis;
    });
    if (consulta === '' && antes !== null) { repor(antes); antes = null; }
    aviso.style.display = total === 0 ? 'block' : 'none';
  }

  try {
    var e = sessionStorage.getItem(CHAVE);
    if (e && e.length === blocos.length) repor(e);
  } catch (x) {}

  blocos.forEach(function (d) { d.addEventListener('toggle', guardar); });
  campo.addEventListener('input', filtrar);
  campo.addEventListener('search', filtrar);
})();
</script>
