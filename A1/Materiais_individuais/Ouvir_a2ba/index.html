<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ouvir</title>
<style>
  :root {
    font-size: 16px;
    --bg: #faf9fb;
    --card: #f4eef6;
    --card-border: #dacbe2;
    --card-hover: #eae1ef;
    --text: #2b2b2b;
    --accent: #6b4c7a;
  }
  body {
    font-family: Calibri, Arial, sans-serif;
    max-width: 40rem;
    margin: 2rem auto;
    padding: 0 1.25rem 2rem;
    color: var(--text);
    line-height: 1.5;
    background: var(--bg);
  }
  h1 {
    font-size: 1.7rem;
    font-weight: 600;
    margin: 0 0 1.4rem;
    padding-bottom: 0.6rem;
    border-bottom: 2px solid var(--card-border);
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  li {
    margin: 0.65rem 0;
  }
  a.exercicio {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    min-height: 3.4rem;
    box-sizing: border-box;
    padding: 0.8rem 1.1rem;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-left: 5px solid var(--accent);
    border-radius: 8px;
    text-decoration: none;
    color: var(--text);
    font-size: 1.15rem;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  a.exercicio:hover, a.exercicio:active {
    background: var(--card-hover);
    box-shadow: 0 2px 6px rgba(107, 76, 122, 0.15);
  }
  a.exercicio:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .label {
    flex: 1 1 auto;
    text-wrap: balance;
  }
  .chev {
    flex: 0 0 auto;
    color: var(--accent);
    font-size: 1.5rem;
    line-height: 1;
  }
  @media (max-width: 380px) {
    h1 { font-size: 1.45rem; }
  }
</style>
</head>
<body>

<h1>Ouvir</h1>

<ul>
    <li><a class="exercicio" href="Maratona_de_Lisboa.html"><span class="label">Maratona de Lisboa</span><span class="chev">&rsaquo;</span></a></li>
    <li><a class="exercicio" href="Viver_em_Portugal.html"><span class="label">Viver em Portugal</span><span class="chev">&rsaquo;</span></a></li>
</ul>

</body>
</html>
