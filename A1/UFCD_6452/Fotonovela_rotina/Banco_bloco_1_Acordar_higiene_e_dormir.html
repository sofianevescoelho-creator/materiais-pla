:root{font-size:16px;--accent:#383582;--bg:#f8f8fb;--card:#eeeef6;--border:#cfcfe3;--text:#2b2b2b;}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Carlito","Calibri","Segoe UI",Arial,sans-serif;line-height:1.4;}
.wrap{max-width:60rem;margin:0 auto;padding:12px 12px 32px;}
header{background:var(--accent);color:#fff;padding:14px 16px 13px;border-radius:10px;margin-bottom:12px;}
header h1{margin:0 0 2px;font-size:1.4rem;font-weight:700;letter-spacing:.2px;line-height:1.3;}
header p{margin:0;font-size:1rem;opacity:.92;line-height:1.4;}
@media (max-width:520px){header p .hs{display:none;}header p .ha,header p .hb{display:block;}}
@media (max-width:360px){header{padding-left:12px;padding-right:12px;}}
@media (min-width:600px){header{padding:18px 24px;margin-bottom:16px;}}
header h1 .nb{white-space:nowrap;}
.grelha{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
@media (min-width:700px){.grelha{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;}}
.cartao{display:block;width:100%;margin:0;padding:0;font:inherit;color:inherit;text-align:left;background:#fff;
  border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:zoom-in;
  transition:box-shadow .15s ease;-webkit-tap-highlight-color:transparent;}
.cartao:hover,.cartao:active{box-shadow:0 2px 8px rgba(56,53,130,.22);}
.cartao:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.cartao img{display:block;width:100%;height:auto;aspect-ratio:1/1;background:var(--card);}
.leg{display:block;padding:8px 10px 10px;font-size:1.0625rem;font-weight:700;line-height:1.25;text-wrap:balance;}
.lb{position:fixed;inset:0;z-index:10;background:rgba(18,16,48,.97);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;padding:64px 12px 12px;}
.lb[hidden]{display:none;}
.lb img{display:block;width:min(100%,calc(100vh - 190px),800px);width:min(100%,calc(100dvh - 190px),800px);
  height:auto;aspect-ratio:1/1;border-radius:10px;background:#000;}
.lb-barra{display:flex;align-items:center;justify-content:center;gap:12px;width:min(100%,800px);}
.lb-leg{flex:1 1 auto;text-align:center;color:#fff;font-size:1.25rem;font-weight:700;line-height:1.25;text-wrap:balance;}
.lb button{flex:0 0 auto;width:48px;height:48px;padding:0;border:0;border-radius:50%;background:#fff;color:var(--accent);
  font:inherit;font-size:1.9rem;font-weight:700;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.lb button:focus-visible{outline:3px solid #fff;outline-offset:3px;}
.lb .lb-x{position:absolute;top:10px;right:10px;font-size:1.6rem;}
.lb.sozinha .lb-ant,.lb.sozinha .lb-seg{display:none;}

.voltar{display:inline-block;color:#fff;text-decoration:none;font-size:1rem;font-weight:700;opacity:.92;padding:6px 0 8px;margin:0 0 2px;}
.voltar:hover,.voltar:focus-visible{text-decoration:underline;opacity:1;}
</style>

  var img = document.getElementById('lbImg');
  var leg = document.getElementById('lbLeg');
  var fechar = lb.querySelector('.lb-x');
  var ant = lb.querySelector('.lb-ant');
  var seg = lb.querySelector('.lb-seg');
  var atual = 0, origem = null, x0 = null;
  if (cartoes.length < 2) lb.classList.add('sozinha');

  function mostrar(n) {
    atual = (n + cartoes.length) % cartoes.length;
    var c = cartoes[atual], f = c.querySelector('img');
    img.src = f.src;
    img.alt = f.alt;
    leg.textContent = c.querySelector('.leg').textContent;
  }
  function abrir(n) {
    origem = document.activeElement;
    mostrar(n);
    lb.hidden = false;
    document.body.style.overflow = 'hidden';
    fechar.focus();
  }
  function fecharLb() {
    lb.hidden = true;
    document.body.style.overflow = '';
    if (origem && origem.focus) origem.focus();
  }
  cartoes.forEach(function (c, i) { c.addEventListener('click', function () { abrir(i); }); });
  fechar.addEventListener('click', fecharLb);
  ant.addEventListener('click', function () { mostrar(atual - 1); });
  seg.addEventListener('click', function () { mostrar(atual + 1); });
  lb.addEventListener('click', function (e) { if (e.target === lb) fecharLb(); });
  document.addEventListener('keydown', function (e) {
    if (lb.hidden) return;
    if (e.key === 'Escape') fecharLb();
    else if (e.key === 'ArrowLeft') mostrar(atual - 1);
    else if (e.key === 'ArrowRight') mostrar(atual + 1);
    else if (e.key === 'Tab') {
      var bs = [fechar, ant, seg].filter(function (b) { return b.offsetParent !== null; });
      var i = bs.indexOf(document.activeElement);
      e.preventDefault();
      bs[(i + (e.shiftKey ? -1 : 1) + bs.length) % bs.length].focus();
    }
  });
  lb.addEventListener('touchstart', function (e) { x0 = e.changedTouches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if (Math.abs(dx) > 50 && cartoes.length > 1) mostrar(atual + (dx < 0 ? 1 : -1));
  }, { passive: true });
})();
</script>
</body>
</html>
